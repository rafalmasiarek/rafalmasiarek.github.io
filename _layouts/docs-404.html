<!DOCTYPE html>
<html lang="en">

<head>
  {% include docs/site-head.html %}
  <link href="{{ "icons/@latest/icons.min.css" | asset_url: "cdn" }}" rel="stylesheet">
</head>

<body class="{{ page.color_theme }} error-404">
  <div class="align-container">
    <div class="align-inner">
      <h1 class="error-404__title">{{ page.page_content.title | default: "Page not found" }}</h1>
      {% if page.page_content.message %}
      <p>{{ page.page_content.message }}</p>
      {% endif %}
      <a href="{{ site.baseurl }}{{ page.header.logo.url | default: '/' }}" class="btn btn--dark btn--rounded btn--w-icon btn--w-icon-left">
        <span class="icon icon-house"></span>
        Go back home
      </a>
    </div><!-- /.align-inner -->
  </div><!-- /.align-container -->
  <script src="{{ "icons/@latest/icons.min.js" | asset_url: "cdn" }}" defer></script>
</body>

</html>
