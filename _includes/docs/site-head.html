<meta charset="UTF-8">
<meta http-equiv="x-ua-compatible" content="ie=edge">
<meta name="viewport" content="width=device-width, minimum-scale=1.0">
<title>{{ page.title }}{% if page.title %} - {% endif %}{{ page.header.logo.text | default: site.title }}</title>
{% if page.description %}
<meta name="description" content="{{ page.description }}">
{% endif %}

<link rel="icon" href="data:,">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css?family=Montserrat:400,400i,500,500i,700,700i|Noto+Sans:400,400i,700,700i|Source+Code+Pro&subset=latin-ext">
{% unless page.header %}
<!-- Roboto Mono + site-header.css - only needed when falling back to the
     main site's own header (below), loaded verbatim so it renders
     identically to the main site - see assets/css/site-header.css and
     the "Main site header" section in docs.scss. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@100..700&display=swap">
{% if jekyll.environment == "production" %}
<link href="{{ "css/site-header.min.css" | asset_url }}" rel="stylesheet">
{% else %}
<link href="{{ "css/site-header.css" | asset_url }}" rel="stylesheet">
{% endif %}
{% endunless %}

{% if jekyll.environment == "production" %}
<link href="{{ "css/docs.min.css" | asset_url }}" rel="stylesheet">
{% else %}
<link href="{{ "css/docs.css" | asset_url }}" rel="stylesheet">
{% endif %}
