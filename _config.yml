title: "Rafal Masiarek"
url: "https://masiarek.pl"
baseurl: ""
timezone: Europe/Warsaw

description: "I am devops. Automation and configuration management tools are the foundation of my work"
github_repo: "https://github.com/rafalmasiarek/rafalmasiarek.github.io"

recaptcha_site_key: "6LfvSI4rAAAAABdOXvYNnDMZEzd_K57A94LlEghS"

plugins:
  - jekyll-last-modified-at
  - jekyll-sitemap
  - jekyll-assets

kirby:
  multisite:
    hosts: {}
    routes:
      "/projects": projects
      "/articles": articles

assets:
  default_strategy: "config_version"
  default_source: local
  default_bust: true

  sources:
    local:
      base_url: ""
      prefix: "/assets"
      preconnect: true

    cdn:
      base_url: "https://cdn.masiarek.pl"
      prefix: ""
      preconnect: true

collections:
  vinyls:
    output: true
    permalink: /vinyls/:name/

nav:
  - title: Home
    url: /
  - title: Contact
    url: /contact
  - title: Legal
    url: /terms-and-conditions
  - title: Vinyls
    url: /vinyls
  - title: I ❤️ OPENSOURCE
    url: /i-love-opensource

robots:
  enabled: true
  user_agent: "*"
  disallow:
    - /
  allow:
    - /llms.txt
    - /terms-and-conditions.txt
  index: false
  follow: false
  noarchive: true
  nosnippet: true
  noimageindex: true
  block_ai: true
  content_signals:
    search: "no"
    ai_input: "no"
    ai_train: "no"
    use: immediate
  custom_block: |
