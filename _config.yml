legal_versions:
  root: legal
  changelog_layout: base
  changelog_page_include: changelog-page.html
  git_support: true
  text_export: true
  git_commit_url_template: "https://github.com/rafalmasiarek/rafalmasiarek.github.io/commit/%{commit}"

include:
  - .htaccess
  - _config.yml
  - _config.deploy.yml
  - .well-known
  - projects
  - "projects/**/.*"
  - "kirby/.cicd-pipeline-exclude"

exclude:
  - "legal"
  - "**/*.md.overwrite"
  - "projects/content"
  - "projects/storage"
  - "projects/media"
  - "projects/cache"
  - "projects/logs"
  - "projects/site/accounts"
  - "projects/site/sessions"
  - "projects/kirby"
